services:
  postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./db/flow.sql:/docker-entrypoint-initdb.d/init.sql

      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 3

  processor:
      build:
        context: .
        dockerfile: processor/Dockerfile
      environment:
        DATABASE_URL: ${DATABASE_URL}
        AWS_PROFILE: ${AWS_PROFILE}
        AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
        SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      depends_on:
        postgres:
          condition: service_healthy
      ports:
        - "8000:8000"
      healthcheck: 
        test: [
          "CMD", "python", "-c", 
          "import requests; requests.get('http://127.0.0.1:8000/health', timeout=2)" 
        ]
        interval: 10s 
        timeout: 3s 
        retries: 3
        start_period: 10s
      volumes:
        - "${USERPROFILE}/.aws:/root/.aws:ro"

  worker:
      build:
        context: .
        dockerfile: processor/Dockerfile
      command: ["python", "-m", "processor.worker"]
      environment:
        DATABASE_URL: ${DATABASE_URL}
        AWS_PROFILE: ${AWS_PROFILE}
        AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
        SQS_QUEUE_URL: ${SQS_QUEUE_URL}
      depends_on:
        postgres:
          condition: service_healthy
      restart: unless-stopped
      stop_grace_period: 30s    # give time to stop worker for graceful shutdown
      volumes:
        - "${USERPROFILE}/.aws:/root/.aws:ro"

volumes:
  postgres_data: