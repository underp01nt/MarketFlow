services:
  postgres:
      image: postgres:16
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./db/flow.sql:/docker-entrypoint-initdb.d/init.sql
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 3

  poller:
      build:
        context: .
        dockerfile: Dockerfile
      command: ["python", "-m", "main.poll"]
      environment:
        DATABASE_URL: ${DATABASE_URL}
        WEBULL_APP_KEY: ${WEBULL_APP_KEY}
        WEBULL_APP_SECRET: ${WEBULL_APP_SECRET}
      depends_on:
        postgres:
          condition: service_healthy
      restart: unless-stopped
      stop_grace_period: 30s    # give time to stop worker for graceful shutdown

volumes:
  postgres_data: