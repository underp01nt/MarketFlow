[build-system]
requires = ["setuptools>=62"]
build-backend = "setuptools.build_meta"

[project]
name = "MarketFlow"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "pydantic",
    "python-dotenv",
    "requests",
    "fastapi",
    "uvicorn[standard]",
    "requests",
    "boto3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["db*", "data", "processor"]